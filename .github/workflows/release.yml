name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install pygame build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libfreetype6-dev libportmidi-dev libjpeg-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: ./build.sh

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: mng-linux
          path: dist/mng

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: ./build.bat

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: mng-windows
          path: dist/mng.exe

  release:
    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: mng-linux
          path: release

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: mng-windows
          path: release

      - name: Rename binaries
        run: |
          mv release/mng release/mng-linux
          mv release/mng.exe release/mng-windows.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
              release/mng-linux \
              release/mng-windows.exe \
              --generate-notes
